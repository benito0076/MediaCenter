# Fabrique MediaCenter.exe sur une machine Windows (PyInstaller ne sait pas le faire depuis Linux),
# le teste, et le met à disposition dans l'onglet Actions (artefact « MediaCenter-windows »).
name: MediaCenter.exe (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 15  # une étape bloquée ne doit pas tourner des heures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (sous Windows, avec l'icône et le registre)
        run: |
          pip install pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0
          python test_mediacenter.py
      - name: Fabrication du .exe
        run: pyinstaller --onefile --noconsole --name MediaCenter --hidden-import pystray._win32 --add-data "jassub;jassub" --add-data "hlsjs;hlsjs" --add-data "web;web" mediacenter.py
      - name: Essai du .exe (démarrage sans console, page, JASSUB et hls.js embarqués, 2e lancement)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force films | Out-Null
          $p = Start-Process -FilePath dist\MediaCenter.exe -ArgumentList '--films','films','--hors-ligne','--port','8765','--sans-navigateur' -PassThru
          Start-Sleep 8
          $page = Invoke-WebRequest http://localhost:8765/ -UseBasicParsing
          $js = Invoke-WebRequest http://localhost:8765/jassub/jassub.js -UseBasicParsing
          $hls = Invoke-WebRequest http://localhost:8765/hlsjs/hls.light.min.js -UseBasicParsing
          $p2 = Start-Process -FilePath dist\MediaCenter.exe -ArgumentList '--hors-ligne','--port','8765','--sans-navigateur' -PassThru -Wait
          $encore = -not $p.HasExited
          Stop-Process $p
          Get-Content dist\mediacenter.log
          if ($p2.ExitCode -ne 0) { throw '2e lancement en erreur' }
          if (-not $encore) { throw 'le 1er lancement s est arrêté' }
          if (-not (Select-String -Path dist\mediacenter.log -Pattern 'films, ' -Quiet)) { throw 'journal mediacenter.log vide' }
          if ($page.Content -notmatch 'Media Center') { throw 'page absente' }
          if ($js.Headers['Content-Type'] -notmatch 'javascript') { throw 'JASSUB absent du .exe' }
          if ($hls.Content.Length -lt 100000) { throw 'hls.js absent du .exe' }
          if (-not (Test-Path dist\mediacenter.json)) { throw 'config pas à côté du .exe' }
          "OK : page servie, JASSUB embarqué, config à côté du .exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MediaCenter-windows
          path: dist/MediaCenter.exe
